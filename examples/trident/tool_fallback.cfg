# Klipper Tool Fallback — Trident Representative Configuration
#
# Revision-bound to Trident revision e7790d022346a62662acfe0b3098ad39eb9eaddc.
# Active topology: T0 and T1 only. Disabled T2–T6 are outside this bundle.
#
# This file declares the global extension section and two active tool sections
# with reciprocal ordered backups. All adapter macros are printer-owned and
# defined in tool_fallback_macros.cfg.
#
# Values marked **Representative assumption** are drawn from the tested Trident
# and define this example. Values marked **Verify on your printer** must be
# checked against your own printer before copying.

[tool_fallback]
# State persistence path — representative assumption
state_path: ~/printer_data/config/tool_fallback_state.json

# Pause / resume macros — printer-owned; verify these names match your macros
pause_gcode: PAUSE
resume_gcode: RESUME

# Private adapter macros — defined in tool_fallback_macros.cfg
purge_gcode: _TOOL_FALLBACK_TRIDENT_PURGE
notify_gcode: _TOOL_FALLBACK_TRIDENT_NOTIFY

# Timeout values — representative assumptions; adjust for your printer
# selection_timeout: 120.0  (seconds)
# heating_timeout: 300.0   (seconds)
# purge_timeout: 180.0     (seconds)

# --- Active tools ----------------------------------------------------------

[tool_fallback T0]
# Filament runout sensor — representative assumption
filament_sensor: filament_switch_sensor T0_sensor
# Heater — representative assumption
heater: extruder
# Ordered backups — reciprocal with T1
backups: T1

[tool_fallback T1]
# Filament runout sensor — representative assumption
filament_sensor: filament_switch_sensor T1_sensor
# Heater — representative assumption
heater: extruder1
# Ordered backups — reciprocal with T0
backups: T0
