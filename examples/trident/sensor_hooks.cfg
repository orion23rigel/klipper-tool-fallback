# Klipper Tool Fallback — Trident Replacement Sensor Hooks
#
# These sections REPLACE the corresponding sections in the Trident's
# klipper-toolchanger/tool_0.cfg and tool_1.cfg. They are not additive
# duplicates.
#
# Before copying these to your printer:
#   1. Remove or rename the legacy REMAP_TOOL, BACKUP_SPOOL, and
#      _TOOL_RUNOUT macros (see examples/trident/README.md for the
#      complete migration sequence).
#   2. Verify that your printer's PAUSE macro behaves correctly with
#      PAUSE_OWNED=1. Do not blindly copy this value.
#   3. Leave disabled T2–T6 untouched and outside extension ownership.

# ----------------------------------------------------------------------------
# Physical tool handlers — simplified MadMax SELECT_TOOL delegates
#
# The extension captures these handlers at klippy:ready. They must remain
# direct delegates to SELECT_TOOL so the extension can record physical
# selection without recreating toolchanger logic.
# ----------------------------------------------------------------------------

[gcode_macro T0]
description: "Physical tool handler for T0 — direct MadMax SELECT_TOOL delegate"
gcode:
    # Simplified physical handler: delegate to MadMax tool selection
    # The extension captures this handler to record physical selection
    SELECT_TOOL T=0

[gcode_macro T1]
description: "Physical tool handler for T1 — direct MadMax SELECT_TOOL delegate"
gcode:
    # Simplified physical handler: delegate to MadMax tool selection
    # The extension captures this handler to record physical selection
    SELECT_TOOL T=1

# ----------------------------------------------------------------------------
# Filament runout sensor hooks — one extension fallback owner per active tool
#
# Each sensor invokes TOOL_FALLBACK_RUNOUT (extension command) instead of the
# legacy _TOOL_RUNOUT macro. This removes the old macro as fallback owner and
# makes pause ownership explicit.
#
# IMPORTANT: PAUSE_OWNED=1 tells the extension to own the pause. Verify that
# your printer's PAUSE macro is safe to invoke from sensor runout context
# before copying this value. If your PAUSE macro performs real motion
# (bucket/silicone, position restoration), ensure clearances are verified.
# ----------------------------------------------------------------------------

[filament_switch_sensor T0_sensor]
# Representative assumption — verify on your printer
pause_on_runout: True
runout_gcode:
    TOOL_FALLBACK_RUNOUT TOOL=T0 PAUSE_OWNED=1
insert_gcode:
    TOOL_FALLBACK_INSERT TOOL=T0

[filament_switch_sensor T1_sensor]
# Representative assumption — verify on your printer
pause_on_runout: True
runout_gcode:
    TOOL_FALLBACK_RUNOUT TOOL=T1 PAUSE_OWNED=1
insert_gcode:
    TOOL_FALLBACK_INSERT TOOL=T1
