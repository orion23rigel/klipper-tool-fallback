# Klipper Tool Fallback — Trident Printer-Owned Adapters
#
# These macros are printer-owned extension adapters. Each one validates its
# input, delegates once to the existing Trident-owned behavior, and never
# recreates routing, fallback, persistence, or delivery ownership.
#
# Do not copy these macros to another printer without adapting the delegated
# macro names to that printer's own implementation.

# ----------------------------------------------------------------------------
# Purge adapter: _TOOL_FALLBACK_TRIDENT_PURGE
#
# The extension invokes this macro after a fallback success to purge the
# selected backup tool. This adapter:
#   1. Validates the TOOL argument is a canonical active tool (T0 or T1).
#   2. Verifies the requested tool is the currently selected physical tool.
#   3. Delegates once to the Trident's bucket purge flow.
#
# It does NOT:
#   - Invoke the public PURGE_TOOL command (prevents recursion).
#   - Select or remap tools.
#   - Mutate fallback state or persistence.
#   - Own any fallback behavior.
# ----------------------------------------------------------------------------

[gcode_macro _TOOL_FALLBACK_TRIDENT_PURGE]
description: "Trident-owned purge adapter for tool fallback"
gcode:
    # Validate canonical tool argument
    {% set tool = params.TOOL|upper %}
    {% if tool not in ['T0', 'T1'] %}
        { action_raise_error("PURGE_TOOL: invalid tool '%s'; expected T0 or T1" % tool) }
    {% endif %}

    # Verify this tool is the currently selected physical tool
    # The extension's status object exposes selected_physical_tool
    {% set selected = printer['tool_fallback'].selected_physical_tool %}
    {% if selected != tool %}
        { action_raise_error("PURGE_TOOL: tool %s is not the selected physical tool (selected: %s)" % (tool, selected)) }
    {% endif %}

    # Delegate once to the Trident bucket purge flow
    # BUCKET_PURGE is printer-owned; do not rename without adapting the caller
    BUCKET_PURGE

# ----------------------------------------------------------------------------
# Notification adapter: _TOOL_FALLBACK_TRIDENT_NOTIFY
#
# The extension invokes this macro with fixed canonical fields after a
# terminal fallback outcome. This adapter:
#   1. Accepts the fixed Phase 5 canonical fields (EVENT, GENERATION,
#      LOGICAL_TOOL, FAILED_TOOL, SELECTED_TOOL, REASON_CODE, and optional
#      REASON_DETAIL).
#   2. Formats a bounded printer-owned message.
#   3. Calls the printer-owned Moonraker `notify` remote method with the
#      notifier name `discord`.
#
# It does NOT:
#   - Contain the destination URL (that lives in moonraker.conf).
#   - Promise downstream delivery (best-effort only).
#   - Call any extension mutation commands.
# ----------------------------------------------------------------------------

[gcode_macro _TOOL_FALLBACK_TRIDENT_NOTIFY]
description: "Trident-owned notification adapter for tool fallback"
gcode:
    # Accept canonical fields from the extension
    {% set event     = params.EVENT     %}
    {% set generation = params.GENERATION %}
    {% set logical   = params.LOGICAL_TOOL %}
    {% set failed    = params.FAILED_TOOL %}
    {% set selected  = params.SELECTED_TOOL %}
    {% set reason    = params.REASON_CODE %}
    {% set detail    = params.REASON_DETAIL|default('n/a') %}

    # Format a bounded printer-owned message
    {% set message = "Tool Fallback: %s | logical=%s failed=%s selected=%s reason=%s detail=%s" % (
        event, logical, failed, selected, reason, detail[:160]
    ) %}

    # Call printer-owned Moonraker notifier — destination is in moonraker.conf
    # Do not embed or copy the Discord webhook URL here
    action_call_remote_method(
        "notify",
        name="discord",
        message=message
    )
